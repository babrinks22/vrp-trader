name: VRP Daily Trade

on:
  schedule:
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install alpaca-py yfinance numpy pandas scipy matplotlib

      - name: Run trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python vrp_live_trader.py

      - name: Commit everything
        run: |
          git config user.name "vrp-bot"
          git config user.email "bot@vrptrader.com"
          git add state.json || true
          git add trade_log.csv || true
          git add spread_log.csv || true
          git add vrp_trader.log || true
          git add diagrams/ || true
          git diff --staged --quiet || git commit -m "trade: $(date '+%Y-%m-%d')"
          git push
